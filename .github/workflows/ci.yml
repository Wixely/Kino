name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  windows:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Authenticate the CupriFace package feed
        shell: pwsh
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username '${{ github.actor }}'
          --password '${{ github.token }}'
          --store-password-in-clear-text
          --configfile NuGet.config
      - name: Install ffmpeg for the rendering tests
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Format, audit, build and test
        timeout-minutes: 20
        shell: pwsh
        run: ./eng/Verify.ps1
      - name: Publish and run the executable's self-tests
        timeout-minutes: 15
        shell: pwsh
        run: ./eng/Package.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*
          if-no-files-found: warn
          retention-days: 7
      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
