name: Release

# Pushing a tag such as v0.1.0 builds, tests and self-tests the Windows executable, then publishes a
# GitHub release with the executable, a zip and their SHA-256 checksums.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.0
        required: true

permissions:
  contents: write
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Build and release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$tag' is not a release tag such as v0.1.0." }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($Matches[1] -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Authenticate the CupriFace package feed
        shell: pwsh
        run: >
          dotnet nuget update source GitHub-Wixely-Packages
          --username '${{ github.actor }}'
          --password '${{ github.token }}'
          --store-password-in-clear-text
          --configfile NuGet.config
      - name: Install ffmpeg for the rendering tests
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Format, audit, build and test
        timeout-minutes: 20
        shell: pwsh
        run: ./eng/Verify.ps1
      - name: Publish and run the executable's self-tests
        timeout-minutes: 15
        shell: pwsh
        run: ./eng/Package.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: artifacts/test-results/*
          if-no-files-found: warn
          retention-days: 7
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notes = @"
          Kino $tag for Windows 10 1809 and later (x64).

          - ``kino-$tag-win-x64.exe``: the self-contained executable. Run it directly; no installer.
          - ``kino-$tag-win-x64.zip``: the same executable with the licence and third-party notices.

          Saving videos needs ffmpeg and ffprobe on PATH (or set in Settings). See the README for details.
          Check downloads against the ``.sha256`` files.
          "@
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag (Get-ChildItem artifacts/release/*).FullName --title "Kino $tag" --notes $notes --verify-tag @flags
